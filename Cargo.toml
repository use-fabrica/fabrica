
[workspace]
resolver = "2"
members = ["crates/fabrica", "crates/ui"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
fabrica = { path = "crates/fabrica" }
ui = { path = "crates/ui" }

anyhow = "1.0.102"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }
